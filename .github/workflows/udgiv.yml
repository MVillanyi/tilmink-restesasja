# Bygger siden og udgiver den på GitHub Pages, hver gang main opdateres.
# Kræver: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Udgiv på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Læser adressen fra Settings → Pages. Med eget domæne bliver
      # base_path tom, så siden automatisk flytter til roden af domænet.
      - name: Læs Pages-indstillinger
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Byg siden
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Kontrollér links og billeder
        run: npm run kontrol
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v5
